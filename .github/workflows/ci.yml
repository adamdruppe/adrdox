name: CI
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        dc:
          - dmd-latest
          - ldc-latest
          - dmd-beta
          - ldc-beta
        # dmd only targets x86_64, and segfaults under Rosetta on arm64
        exclude:
          - os: macos-latest
            dc: dmd-latest
          - os: macos-latest
            dc: dmd-beta
        include:
          - os: macos-26-intel
            dc: dmd-latest
          - os: macos-26-intel
            dc: dmd-beta
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Build binary
        run: dub build -b debug

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-i686
            os: ubuntu-latest
            arch: x86
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: macos-arm64
            os: macos-latest
            arch: aarch64
          - name: macos-x86_64
            os: macos-latest
            arch: x86_64
          - name: windows-i686
            os: windows-latest
            arch: x86
          - name: windows-x86_64
            os: windows-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.name == 'linux-i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib lib32z1-dev
      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Build binary release
        run: dub build -a ${{ matrix.arch }} -b release
      - name: Create dist
        uses: papeloto/action-zip@v1.3
        with:
          files: build README.md
          dest: adrdox_${{ matrix.name }}.zip
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: adrdox_${{ matrix.name }}.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dists
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: '*.zip'
          #prerelease: true
          draft: true
